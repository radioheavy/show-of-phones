<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="generator" content="Show of Phones">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../_engine/theme.css">
<link rel="stylesheet" href="../_engine/deck.css">
{{TALK_CSS}}
<script>window.SOP_TALK = {{CONFIG}};</script>
</head>
<body>
<div id="viewport">
<main id="stage">
{{SLIDES}}
</main>
<div id="fx"></div>
</div>
<div id="blackout"></div>
<div id="hint"></div>
<nav id="nav"><button data-a="prev" aria-label="previous">‹</button><button data-a="next" aria-label="next">›</button><button data-a="full" aria-label="fullscreen">⛶</button></nav>
<div id="pair" role="dialog" aria-modal="true" aria-labelledby="pairTitle" hidden>
  <div class="pair__box">
    <p class="pair__tag" id="pairTag"></p>
    <h2 id="pairTitle"></h2>
    <p class="pair__how" id="pairHow"></p>
    <div class="pair__code" id="pairCode" aria-live="polite">······</div>
    <p class="pair__status" id="pairStatus"></p>
    <details class="pair__alt"><summary id="pairAltSum"></summary>
      <form id="pairKeyForm"><input id="pairKey" type="password" autocomplete="off"><button type="submit" id="pairKeyGo"></button></form>
    </details>
    <button class="pair__close" id="pairClose" type="button"></button>
  </div>
</div>
<script src="../_engine/i18n.js"></script>
<script src="../_engine/vendor/qrcode.js" defer></script>
<script src="../_engine/deck.js" defer></script>
{{TALK_JS}}
</body>
</html>
