<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>{{TITLE}} · remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../_engine/theme.css">
<link rel="stylesheet" href="../../_engine/remote.css">
{{PHONE_CSS}}
<script>window.SOP_TALK = {{CONFIG}};</script>
</head>
<body class="sop-remote">
<header>
  <div>
    <h1 id="h1"></h1>
    <div class="conn"><span class="dot" id="cdot"></span><span id="ctxt"></span></div>
    <div class="conn"><button class="linkbtn" id="pairToggle" type="button" hidden></button></div>
  </div>
  <div><div class="lbl" style="text-align:right" id="clockLbl"></div><div class="clock" id="clock">0:00</div></div>
</header>
<div class="alert" id="alert"></div>
<form class="pairbox" id="pairbox" autocomplete="off">
  <div class="lbl" id="pairTitle"></div>
  <p id="pairHow"></p>
  <input id="pairIn" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="000 000" aria-label="code">
  <button id="pairGo" type="submit"></button>
  <div class="pairmsg" id="pairMsg"></div>
</form>
<div class="keybox" id="keybox"><input id="keyIn" type="password" autocomplete="off"><button id="keyGo"></button></div>
<div class="row">
  <div class="box"><div class="lbl"><span id="nowLbl"></span> <span id="pos"></span></div><div class="now" id="now"></div><div class="steps" id="steps"></div></div>
  <div class="box"><div class="lbl" id="nextLbl"></div><div class="next" id="next">—</div>
    <div class="lbl" style="margin-top:14px" id="liveLbl"></div>
    <div class="live" id="live"></div>
  </div>
</div>
<div class="box"><div class="lbl" id="notesLbl"></div><div class="notes" id="notes"></div></div>
<div class="bar">
  <button id="prev"></button>
  <button class="big" id="nextBtn"></button>
  <button id="black"></button>
  <select id="jump" aria-label="go to slide"><option value=""></option></select>
  <button class="warn" id="reset"></button>
</div>
<script src="../../_engine/i18n.js"></script>
<script src="../../_engine/remote.js"></script>
</body>
</html>
